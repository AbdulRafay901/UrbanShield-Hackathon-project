<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanShield Dashboard</title>

    <!-- Google Fonts for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Remix Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    
    <link rel="stylesheet" href="./components/siderbar.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="dashboard-layout d-flex">
        <!-- Sidebar Container (Keep your existing sidebar code inside here) -->
        <div id="sidebarComponent"></div>

        <!-- MAIN DASHBOARD CONTENT -->
        <div class="main-content flex-grow-1">
            
            <!-- Topbar / Header -->
            <header class="topbar d-flex justify-content-between align-items-center mb-4">

                <div class="t">
                      <i class="ri-menu-line" id="fill"></i>    
                </div>


                <div class="search-container d-flex align-items-center">
                    <i class="ri-search-line"></i>
                    <input type="text" placeholder="Search for city...">
                </div>
                
                <div class="location-header d-flex flex-column align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <i class="ri-map-pin-fill text-white fs-5"></i>
                        <span class="text-white fw-semibold location-name"></span>
                    </div>
                    <small class="text-muted">Auto-detected</small>
                </div>
                
                <div class="user-actions d-flex align-items-center gap-3">
                    <a href="./pages/alertsPage.html" style="text-decoration: none;"><div class="notification-btn">
                        <i class="ri-notification-3-line"></i>
                        <div class="dot"></div>
                    </div>
                    </a>
                </div>
            </header>

            <!-- Main Row 1 -->
            <div class="row g-4 mb-4">
                
                <!-- Weather Card -->
                <div class="col-xl-6 col-lg-12">
                    <div class="premium-card weather-gradient h-100 d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="text-white fw-normal mb-4 fs-6">Current Weather</h5>
                            <div class="d-flex align-items-center gap-4">
                                <img src="assets/cloud.png" class="weather-img"  alt="Cloudy" style="width: 100px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));">
                                <div class="text-white">
                                    <h1 class="display-3 fw-bold mb-0" style="letter-spacing: -2px;"></h1>
                                    <h5 class="fw-semibold mb-0 mt-1 name"></h5>
                                    <small style="color: rgba(255,255,255,0.7);" class="feels-like"></small>
                                </div>
                            </div>
                        </div>
                        <div class="weather-details d-flex justify-content-between align-items-center mt-4">
                            <div class="text-center">
                                <small class="detail-label">Humidity</small>
                                <h6 class="text-white mb-0 fw-semibold humidity"></h6>
                            </div>
                            <div class="text-center">
                                <small class="detail-label">Wind</small>
                                <h6 class="text-white mb-0 fw-semibold windspeed"></h6>
                            </div>
                            <div class="text-center">
                                <small class="detail-label">Pressure</small>
                                <h6 class="text-white mb-0 fw-semibold pressure"></h6>
                            </div>
                            <div class="text-center">
                                <small class="detail-label">Visibility</small>
                                <h6 class="text-white mb-0 fw-semibold visiblity"></h6>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AQI, UV & Alerts -->
                <div class="col-xl-6 col-lg-12">
                    <div class="row g-4 mb-3">
                        <!-- AQI Card -->
                        <div class="col-sm-6">
                            <div class="premium-card bg-card h-100 air-card">
                                <h6 class="text-white mb-3 fs-6">Air Quality Index</h6>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h2 class="text-white fw-bold mb-0 aqi"></h2>
                                        <span class="text-success fw-medium text-uppercase air-level" style="font-size: 12px; letter-spacing: 1px;">Moderate</span>
                                    </div>
                                    <div class="circular-progress air-circle"></div>
                                </div>
                                <p class="text-muted mt-3 mb-0 AirQuality-Ai" style="font-size: 12px; line-height: 1.5;"> 
                                    <span class="spinner-border spinner-border-sm me-1" style="width: 0.8rem; height: 0.8rem;">
                                    </span> AI Suggesting...</p>
                            </div>
                        </div>
                        <!-- UV Card -->
                        <div class="col-sm-6">
                            <div class="UV-card bg-card h-100">
                                <h6 class="text-white mb-3 fs-6">UV Index</h6>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h2 class="fw-bold mb-0 uv-value"></h2>
                                        <span class="fw-medium text-uppercase uv-status" style="font-size: 12px; letter-spacing: 1px; "></span>
                                    </div>
                                    <div class="uv-circle"></div>
                                </div>
                                <p class="text-muted mt-3 mb-0 uv-advice" style="font-size: 12px; line-height: 1.5;"></p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Alert Mini Cards -->
                    <div class="row g-3">
                        <div class="col-sm-4">
                            <div class="alert-box weather-mini-card">
                                <div class="d-flex gap-2 align-items-center mb-1">
                                    <p style="margin: 0;"></p>
                                    <span class="text-white fw-medium" style="font-size: 12px;">
                                        <span class="text-muted"></span>
                                    </span>
                                </div>
                                <p class="mb-0" style="font-size: 10px; color: var(--text-light);"></p>
                            </div>
                        </div>
                        <div class="col-sm-4">
                        <div class="alert-box " id="uvAlertCard">
                            <div class="d-flex gap-2 align-items-center mb-1">
                                <p style="margin: 0;" id="uvAlertIcon"></p>
                                <span class=" fw-medium" id="uvAlertTitle" style="font-size: 12px;"></span>
                            </div>
                            <p class="mb-0" id="uvAlertDesc" style="font-size: 10px; color: var(--text-light);"></p>
                        </div>
                         </div>
                        <div class="col-sm-4">
                         <div class="alert-box " id="airAlertCard">
                             <div class="d-flex gap-2 align-items-center mb-1">
                                 <i style="margin: 0;" id="airAlertIcon"></i>
                                 <span class="fw-medium" id="airAlertTitle" style="font-size: 12px;"></span>
                             </div>
                             <p class="mb-0" id="airAlertDesc" style="font-size: 10px; color: var(--text-light);"></p>
                         </div>
                    </div>
                    </div>
                </div>
            </div>

            <!-- Nearby Places -->
            <div class="mb-4 mt-2">
                 <div class="d-flex justify-content-between align-items-center mb-3">
                     <h6 class="text-white mb-0 fw-medium">Nearby Places</h6>
                     <a href="./pages/mapPage.html" class="text-primary text-decoration-none" style="font-size: 13px;">View on Map</a>
                 </div>
    
                 <!-- Target Container with ID -->
                 <div id="nearbyPlacesContainer" class="d-flex gap-3 overflow-auto hide-scrollbar pb-1">
                    
                 </div>
            </div>

            <!-- Forecasts & Charts Row -->
            <div class="row g-4">
                <div class="col-xl-8 col-lg-12">
                    <div class="premium-card bg-card h-100 p-4">
                        <h6 class="text-white mb-4 fs-6">Today's Overview</h6>
                        <div class="chart-legend d-flex gap-4 mb-3" style="font-size: 12px;">
                            <div class="d-flex align-items-center gap-2"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--warning);"></span><span class="text-muted">Temperature (°C)</span></div>
                            <div class="d-flex align-items-center gap-2"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--primary);"></span><span class="text-muted">Humidity (%)</span></div>
                            <div class="d-flex align-items-center gap-2"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--success);"></span><span class="text-muted">Wind (km/h)</span></div>
                        </div>
                        <!-- Canvas Container -->
                        <div style="height: 220px; width: 100%;">
                            <canvas id="premiumChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="col-xl-4 col-lg-12">
                     <div class="premium-card bg-card h-100 p-4">
                           <h6 class="text-white mb-4 fs-6">
                               Safety Tips
                           </h6>
                           <div class="d-flex flex-column gap-4 safety-tips-container">
                           </div>
                     </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="./components/sidebar.js"></script>
    <script type="module" src="./js/todayOverview.js"></script>
    <script type="module" src="./js/app.js"></script>
    
</body>
</html>
