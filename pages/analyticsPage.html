<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - UrbanShield</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Remix Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../components/siderbar.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/analyticsPage.css">
</head>
<body>

    <div class="dashboard-layout d-flex">
        <!-- Sidebar Container -->
        <div id="sidebarComponent"></div>

        <!-- MAIN ANALYTICS CONTENT -->
        <div class="main-content flex-grow-1">
            
            <!-- Topbar / Header -->
            <header class="topbar d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="t d-lg-none">
                        <i class="ri-menu-line" id="fill"></i>
                    </div>
                    <a href="../index.html" class="analytics-back-btn" title="Back to Dashboard">
                        <i class="ri-arrow-left-s-line"></i>
                    </a>
                    <h5 class="analytics-header-title">Analytics</h5>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <select id="analyticsFilter" class="analytics-select-filter">
                        <option value="7">7 Days</option>
                        <option value="30">30 Days</option>
                    </select>
                    <a href="../pages/alertsPage.html" style="text-decoration: none;">
                    <div class="notification-btn">
                        <i class="ri-notification-3-line"></i>
                        <div class="dot"></div>
                    </div>
                    </a>
                </div>
            </header>

            <!-- Main Charts Grid -->
            <div class="row g-4 mb-4">
                
                <!-- Temperature Line Chart Card -->
                <div class="col-12">
                    <div class="analytics-chart-card">
                        <h6 class="chart-card-title">Temperature (°C)</h6>
                        <div class="chart-wrapper">
                            <canvas id="tempLineChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Air Quality Bar Chart Card -->
                <div class="col-12">
                    <div class="analytics-chart-card">
                        <h6 class="chart-card-title">Air Quality (AQI)</h6>
                        <div class="chart-wrapper">
                            <canvas id="aqiBarChart"></canvas>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        // Load Sidebar dynamically with relative path support
        const isPagesDir = window.location.pathname.includes('/pages/');
        const sidebarPath = isPagesDir ? '../components/sidebar.html' : 'components/sidebar.html';

        fetch(sidebarPath)
            .then(res => res.text())
            .then(data => {
                const sidebarContainer = document.getElementById("sidebarComponent");
                if (sidebarContainer) {
                    sidebarContainer.innerHTML = data;

                    // Fix relative paths for logo if inside pages directory
                    if (isPagesDir) {
                        const logoImg = sidebarContainer.querySelector('.logo-text img');
                        if (logoImg && !logoImg.src.includes('../assets/')) {
                            logoImg.src = '../assets/logo.png';
                        }

                        // Highlight active Analytics tab
                        const tabs = sidebarContainer.querySelectorAll('.tab');
                        tabs.forEach(tab => {
                            tab.classList.remove('tab-active');
                            if (tab.getAttribute('data-page') === 'analytics') {
                                tab.classList.add('tab-active');
                            }
                        });
                    }
                }
            })
            .catch(err => console.error("Error loading sidebar component:", err));
    </script>
    
    <script type="module" src="../js/analyticsPage.js"></script>
    <script type="module" src="../components/sidebar.js"></script>
</body>
</html>
