<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Places Map - UrbanShield</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Remix Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../components/siderbar.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mapPage.css">
</head>
<body>

    <div class="dashboard-layout d-flex">
        <!-- Sidebar Container -->
        <div id="sidebarComponent"></div>

        <!-- MAIN MAP CONTENT -->
        <div class="main-content flex-grow-1">
            
            <!-- Topbar / Header -->
            <header class="topbar d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="t d-lg-none">
                        <i class="ri-menu-line" id="fill"></i>
                    </div>
                    <a href="../index.html" class="map-back-btn" title="Back to Dashboard">
                        <i class="ri-arrow-left-s-line"></i>
                    </a>
                    <h5 class="map-header-title">Nearby Places</h5>
                </div>

                <div class="user-actions d-flex align-items-center gap-3">
                    <a href="../index.html" class="notification-btn text-white text-decoration-none">
                        <i class="ri-close-line"></i>
                    </a>
                </div>
            </header>

            <!-- Main Map & Places Section -->
            <div class="row g-4 mb-4">
                <div class="col-12">
                    
                    <!-- Category Filter Chips -->
                    <div class="map-filters-bar mb-3">
                        <div class="map-filter-chip active" data-category="all">
                            <span class="filter-dot dot-blue"></span> All Places
                        </div>
                        <div class="map-filter-chip" data-category="hospital">
                            <span class="filter-dot dot-red"></span> Hospital
                        </div>
                        <div class="map-filter-chip" data-category="pharmacy">
                            <span class="filter-dot dot-green"></span> Pharmacy
                        </div>
                        <div class="map-filter-chip" data-category="police">
                            <span class="filter-dot dot-blue"></span> Police
                        </div>
                        <div class="map-filter-chip" data-category="atm">
                            <span class="filter-dot dot-purple"></span> ATM
                        </div>
                    </div>

                    <!-- Dark Radar Map Container -->
                    <div class="map-canvas-card mb-4">
                        <div id="mapViewport" class="map-viewport">
                            <div class="dark-radar-overlay"></div>
                        </div>
                    </div>

                    <!-- Nearby Places List Below Map -->
                    <h6 class="text-white mb-3 fw-medium" style="font-size: 14px;">Nearby Services</h6>
                    
                    <div id="nearbyPlacesList" class="nearby-places-list">
                        <!-- Populated dynamically by mapPage.js -->
                        <div class="text-center py-4 text-muted small">
                            <span class="spinner-border spinner-border-sm me-2"></span> Locating nearby places...
                        </div>
                    </div>

                    <a href="#" id="viewAllMapBtn" class="view-all-map-btn mt-3">View All on Map</a>

                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Load Sidebar dynamically with relative path support
        const isPagesDir = window.location.pathname.includes('/pages/');
        const sidebarPath = isPagesDir ? '../components/sidebar.html' : 'components/sidebar.html';

        fetch(sidebarPath)
            .then(res => res.text())
            .then(data => {
                const sidebarContainer = document.getElementById("sidebarComponent");
                if (sidebarContainer) {
                    sidebarContainer.innerHTML = data;

                    // Fix relative paths for logo if inside pages directory
                    if (isPagesDir) {
                        const logoImg = sidebarContainer.querySelector('.logo-text img');
                        if (logoImg && !logoImg.src.includes('../assets/')) {
                            logoImg.src = '../assets/logo.png';
                        }

                        // Highlight active Map tab
                        const tabs = sidebarContainer.querySelectorAll('.tab');
                        tabs.forEach(tab => {
                            tab.classList.remove('tab-active');
                            if (tab.getAttribute('data-page') === 'map') {
                                tab.classList.add('tab-active');
                            }
                        });
                    }
                }
            })
            .catch(err => console.error("Error loading sidebar component:", err));
    </script>
    
    <script type="module" src="../js/mapPage.js"></script>
    <script type="module" src="../components/sidebar.js"></script>
</body>
</html>
